# Alarme de publicação: todo dia às 10h30 de Brasília (13h30 UTC) confere se os artigos
# agendados saíram no rfarias.com. Se algo faltar, este fluxo falha e o GitHub avisa por e-mail.
# Só lê o site; não publica nem altera nada. Também dá para rodar à mão em Actions > Alarme de publicação.
name: Alarme de publicação

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir publicação
        run: node scripts/alarme-publicacao.mjs
