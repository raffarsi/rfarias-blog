  <!-- Logo mark -->
  <circle cx="100" cy="120" r="12" fill="#1A56DB"/>
  <circle cx="72" cy="168" r="12" fill="#1A56DB"/>
  <circle cx="128" cy="168" r="12" fill="#1A56DB"/>
  <circle cx="100" cy="152" r="9" fill="#E84F4F"/>
  <line x1="100" y1="132" x2="100" y2="143" stroke="#1A56DB" stroke-width="4"/>
  <line x1="93" y1="158" x2="77" y2="166" stroke="#1A56DB" stroke-width="4"/>
  <line x1="107" y1="158" x2="123" y2="166" stroke="#1A56DB" stroke-width="4"/>

  <!-- Logo text -->
  <text x="148" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white">rfarias</text>

