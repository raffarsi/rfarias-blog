      <stop offset="0%" style="stop-color:#0f1f3d"/>
      <stop offset="100%" style="stop-color:#1a3a6b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="180" fill="#1A56DB" opacity="0.15"/>
  <circle cx="100" cy="560" r="140" fill="#1A56DB" opacity="0.1"/>

  <!-- Left accent bar -->
