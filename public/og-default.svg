  <text x="100" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="white">Tecnologia, Cloud e IA</text>
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#93b8f0">por Rafael Farias da Silva</text>

