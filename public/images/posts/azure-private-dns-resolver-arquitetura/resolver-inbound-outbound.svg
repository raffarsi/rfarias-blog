<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562" role="img" aria-label="Azure Private DNS Resolver no hub: o DNS on-premises encaminha openai.azure.com e search.windows.net para o inbound endpoint 10.0.4.4, que responde pelas zonas privatelink vinculadas ao hub; o outbound endpoint, com o ruleset empresa.local para 192.168.1.10, envia consultas da empresa ao DNS on-premises pela conectividade híbrida">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A56DB"/>
    </marker>
    <marker id="setaCinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8593A8"/>
    </marker>
  </defs>
  <rect width="1000" height="562" fill="#FFFFFF"/>

  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#10233F">As duas peças do Resolver</text>
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4A5568">O inbound recebe consultas, o outbound envia. Uma sub-rede para cada um, no hub.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <!-- ON-PREMISES -->
    <rect x="60" y="120" width="230" height="320" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="175" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">On-premises</text>
    <rect x="80" y="162" width="190" height="100" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="175" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#10233F">Encaminhador condicional</text>
    <text x="175" y="208" text-anchor="middle" font-size="13" fill="#4A5568">openai.azure.com</text>
    <text x="175" y="227" text-anchor="middle" font-size="13" fill="#4A5568">search.windows.net</text>
    <text x="175" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#1A56DB">para 10.0.4.4</text>
    <rect x="80" y="320" width="190" height="100" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="175" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#10233F">DNS da empresa</text>
    <text x="175" y="374" text-anchor="middle" font-size="13" fill="#4A5568">empresa.local</text>
    <text x="175" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#1A56DB">192.168.1.10</text>

    <!-- CONECTIVIDADE HIBRIDA -->
    <rect x="322" y="150" width="140" height="290" rx="10" fill="#FFFFFF" stroke="#8593A8" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="392" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#10233F">Conectividade</text>
    <text x="392" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#10233F">híbrida</text>
    <text x="392" y="327" text-anchor="middle" font-size="13" fill="#4A5568">VPN ou ExpressRoute</text>

    <!-- HUB -->
    <rect x="494" y="120" width="446" height="320" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="717" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Hub (VNet do resolver)</text>

    <rect x="514" y="162" width="196" height="100" rx="6" fill="#FFFFFF" stroke="#1A56DB" stroke-width="2"/>
    <text x="612" y="184" text-anchor="middle" font-size="12" fill="#8593A8">snet-dns-inbound 10.0.4.0/28</text>
    <text x="612" y="213" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Inbound endpoint</text>
    <text x="612" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1A56DB">10.0.4.4</text>
    <text x="612" y="254" text-anchor="middle" font-size="12" fill="#4A5568">recebe consultas</text>

    <rect x="740" y="162" width="180" height="100" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="830" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#10233F">Zonas privatelink</text>
    <text x="830" y="218" text-anchor="middle" font-size="13" fill="#4A5568">vinculadas à</text>
    <text x="830" y="237" text-anchor="middle" font-size="13" fill="#4A5568">VNet do hub</text>
    <line x1="712" y1="212" x2="736" y2="212" stroke="#8593A8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#setaCinza)"/>

    <rect x="514" y="320" width="196" height="100" rx="6" fill="#FFFFFF" stroke="#1A56DB" stroke-width="2"/>
    <text x="612" y="342" text-anchor="middle" font-size="12" fill="#8593A8">snet-dns-outbound 10.0.4.16/28</text>
    <text x="612" y="371" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Outbound endpoint</text>
    <text x="612" y="396" text-anchor="middle" font-size="12" fill="#4A5568">envia consultas</text>

    <rect x="740" y="320" width="180" height="100" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="830" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#10233F">Ruleset</text>
    <text x="830" y="368" text-anchor="middle" font-size="13" fill="#4A5568">empresa.local.</text>
    <text x="830" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#1A56DB">para 192.168.1.10</text>
    <text x="830" y="407" text-anchor="middle" font-size="12" fill="#8593A8">vinculado ao hub</text>
    <line x1="738" y1="370" x2="712" y2="370" stroke="#8593A8" stroke-width="1.8" stroke-dasharray="4 3"/>

    <!-- FLUXOS -->
    <line x1="272" y1="212" x2="510" y2="212" stroke="#1A56DB" stroke-width="2.5" marker-end="url(#seta)"/>
    <circle cx="392" cy="212" r="13" fill="#1A56DB"/>
    <text x="392" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>

    <line x1="512" y1="370" x2="274" y2="370" stroke="#1A56DB" stroke-width="2.5" marker-end="url(#seta)"/>
    <circle cx="392" cy="370" r="13" fill="#1A56DB"/>
    <text x="392" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>

    <!-- LEGENDA -->
    <circle cx="72" cy="476" r="11" fill="#1A56DB"/>
    <text x="72" y="481" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="92" y="481" font-size="14" fill="#10233F"><tspan font-weight="700">On-premises para o Azure:</tspan> o inbound responde com as zonas privadas vinculadas ao hub.</text>
    <circle cx="72" cy="508" r="11" fill="#1A56DB"/>
    <text x="72" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="92" y="513" font-size="14" fill="#10233F"><tspan font-weight="700">Azure para o on-premises:</tspan> o ruleset manda empresa.local ao DNS da empresa pelo outbound.</text>
  </g>
</svg>
