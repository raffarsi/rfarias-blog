<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562" role="img" aria-label="Os quatro saltos de rede de uma consulta RAG: salto 1 do usuário ao agente no Microsoft Foundry; salto 2 do agente ao Azure OpenAI para o embedding da pergunta; salto 3 do agente ao Azure AI Search para a busca híbrida; salto 4 do agente ao Azure OpenAI para a geração, com a resposta voltando em streaming ao usuário">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A56DB"/>
    </marker>
  </defs>
  <rect width="1000" height="562" fill="#FFFFFF"/>

  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#10233F">Os quatro saltos de rede de uma consulta RAG</text>
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4A5568">Cada seta é um salto de rede com seu próprio custo de latência</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Regiao dos saltos internos -->
    <rect x="372" y="122" width="586" height="336" rx="12" fill="none" stroke="#8593A8" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="392" y="150" font-size="13" font-weight="700" letter-spacing="1.2" fill="#8593A8">SALTOS INTERNOS</text>

    <!-- Usuario -->
    <rect x="60" y="250" width="150" height="80" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="135" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#10233F">Usuário</text>

    <!-- Agente -->
    <rect x="390" y="245" width="180" height="90" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="480" y="284" text-anchor="middle" font-size="17" font-weight="700" fill="#10233F">Agente</text>
    <text x="480" y="308" text-anchor="middle" font-size="14" fill="#4A5568">Microsoft Foundry</text>

    <!-- Servicos -->
    <rect x="740" y="150" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="840" y="177" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Azure OpenAI</text>
    <text x="840" y="199" text-anchor="middle" font-size="13" fill="#4A5568">embedding da pergunta</text>

    <rect x="740" y="257" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="840" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Azure AI Search</text>
    <text x="840" y="306" text-anchor="middle" font-size="13" fill="#4A5568">busca híbrida</text>

    <rect x="740" y="364" width="200" height="66" rx="8" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
    <text x="840" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Azure OpenAI</text>
    <text x="840" y="413" text-anchor="middle" font-size="13" fill="#4A5568">geração da resposta</text>

    <!-- Salto 1 -->
    <line x1="212" y1="272" x2="386" y2="272" stroke="#1A56DB" stroke-width="2.5" marker-end="url(#seta)"/>
    <!-- Retorno em streaming (parte do salto 4) -->
    <line x1="388" y1="310" x2="214" y2="310" stroke="#1A56DB" stroke-width="2" marker-end="url(#seta)"/>
    <text x="300" y="350" text-anchor="middle" font-size="13" fill="#4A5568">resposta em streaming</text>
    <text x="300" y="242" text-anchor="middle" font-size="13" fill="#4A5568">pergunta</text>

    <!-- Saltos 2, 3, 4 -->
    <line x1="572" y1="262" x2="736" y2="186" stroke="#1A56DB" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="572" y1="290" x2="736" y2="290" stroke="#1A56DB" stroke-width="2.5" marker-end="url(#seta)"/>
    <line x1="572" y1="318" x2="736" y2="394" stroke="#1A56DB" stroke-width="2.5" marker-end="url(#seta)"/>

    <!-- Numeros -->
    <g font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="300" cy="272" r="15" fill="#1A56DB"/><text x="300" y="277">1</text>
      <circle cx="654" cy="224" r="15" fill="#1A56DB"/><text x="654" y="229">2</text>
      <circle cx="654" cy="290" r="15" fill="#1A56DB"/><text x="654" y="295">3</text>
      <circle cx="654" cy="356" r="15" fill="#1A56DB"/><text x="654" y="361">4</text>
    </g>
  </g>

  <text x="60" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#4A5568">Salto 1 depende da localização do usuário. Os saltos internos são os que a arquitetura de rede pode otimizar.</text>
  <text x="60" y="524" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8593A8">Com vetorização integrada no índice, a chamada de embedding do salto 2 é feita pelo próprio AI Search.</text>
</svg>
