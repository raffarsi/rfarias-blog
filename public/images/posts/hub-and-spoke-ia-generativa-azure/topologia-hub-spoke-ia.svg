<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562" role="img" aria-label="Topologia hub-and-spoke para IA generativa: VNet hub com Azure Firewall, gateway VPN ou ExpressRoute, DNS Resolver privado e Azure Bastion, conectada por peering a dois spokes de IA (RH e Finance), cada um com agentes no Microsoft Foundry ou App Service e sub-rede snet-pe com Private Endpoints do OpenAI e do Search; a saída para a internet dos spokes passa pelo Azure Firewall do hub">
  <defs>
    <marker id="seta-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/>
    </marker>
  </defs>
  <rect width="1000" height="562" fill="#FFFFFF"/>

  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#10233F">Onde cada componente entra na topologia</text>
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4A5568">O hub concentra o que é compartilhado; cada spoke de IA, o que é do domínio</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- HUB -->
    <rect x="250" y="112" width="500" height="170" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="270" y="138" font-size="15" font-weight="700" fill="#1A56DB">VNet hub</text>
    <g font-size="13" fill="#10233F" text-anchor="middle">
      <rect x="270" y="150" width="145" height="48" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="342" y="170" font-weight="700">Gateway</text>
      <text x="342" y="188" fill="#4A5568">VPN ou ExpressRoute</text>
      <rect x="427" y="150" width="145" height="48" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="499" y="170" font-weight="700">DNS Resolver</text>
      <text x="499" y="188" fill="#4A5568">privado</text>
      <rect x="584" y="150" width="146" height="48" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="657" y="170" font-weight="700">Azure Bastion</text>
      <text x="657" y="188" fill="#4A5568">acesso administrativo</text>
      <rect x="400" y="212" width="200" height="50" rx="6" fill="#1A56DB" stroke="#1A56DB" stroke-width="1.5"/>
      <text x="500" y="233" font-weight="700" fill="#FFFFFF">Azure Firewall</text>
      <text x="500" y="251" fill="#FFFFFF">inspeção de saída</text>
    </g>

    <!-- INTERNET -->
    <rect x="810" y="207" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#8593A8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="875" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#10233F">Internet</text>
    <text x="875" y="290" text-anchor="middle" font-size="12" fill="#4A5568">só destinos com regra</text>
    <text x="875" y="306" text-anchor="middle" font-size="12" fill="#4A5568">explícita (ex.: PyPI, npm)</text>

    <!-- CAMINHO DE SAIDA / PEERING -->
    <path d="M600,237 H806" fill="none" stroke="#1E8E3E" stroke-width="2.5" marker-end="url(#seta-verde)"/>
    <path d="M250,330 V310 H750 V330" fill="none" stroke="#1E8E3E" stroke-width="2.5"/>
    <path d="M500,310 V266" fill="none" stroke="#1E8E3E" stroke-width="2.5" marker-end="url(#seta-verde)"/>
    <text x="512" y="302" font-size="13" font-weight="700" fill="#1E8E3E">peering</text>

    <!-- SPOKE RH -->
    <rect x="60" y="330" width="380" height="160" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="80" y="356" font-size="15" font-weight="700" fill="#1A56DB">VNet spoke IA-RH</text>
    <g font-size="13" fill="#10233F" text-anchor="middle">
      <rect x="80" y="372" width="165" height="102" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="162" y="410" font-weight="700">Agentes</text>
      <text x="162" y="430" fill="#4A5568">Microsoft Foundry</text>
      <text x="162" y="448" fill="#4A5568">ou App Service</text>
      <rect x="262" y="372" width="158" height="102" rx="6" fill="#FFFFFF" stroke="#1A56DB" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="341" y="390" font-weight="700" fill="#1A56DB">snet-pe</text>
      <rect x="276" y="400" width="130" height="30" rx="5" fill="#EEF3FB" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="341" y="420">PE OpenAI</text>
      <rect x="276" y="438" width="130" height="30" rx="5" fill="#EEF3FB" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="341" y="458">PE Search</text>
    </g>

    <!-- SPOKE FINANCE -->
    <rect x="560" y="330" width="380" height="160" rx="10" fill="#EEF3FB" stroke="#1A56DB" stroke-width="2.5"/>
    <text x="580" y="356" font-size="15" font-weight="700" fill="#1A56DB">VNet spoke IA-Finance</text>
    <g font-size="13" fill="#10233F" text-anchor="middle">
      <rect x="580" y="372" width="165" height="102" rx="6" fill="#FFFFFF" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="662" y="410" font-weight="700">Agentes</text>
      <text x="662" y="430" fill="#4A5568">Microsoft Foundry</text>
      <text x="662" y="448" fill="#4A5568">ou App Service</text>
      <rect x="762" y="372" width="158" height="102" rx="6" fill="#FFFFFF" stroke="#1A56DB" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="841" y="390" font-weight="700" fill="#1A56DB">snet-pe</text>
      <rect x="776" y="400" width="130" height="30" rx="5" fill="#EEF3FB" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="841" y="420">PE OpenAI</text>
      <rect x="776" y="438" width="130" height="30" rx="5" fill="#EEF3FB" stroke="#C9D8F0" stroke-width="1.5"/>
      <text x="841" y="458">PE Search</text>
    </g>
  </g>

  <text x="60" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#4A5568">Em verde, o caminho de saída: toda saída dos spokes para a internet passa pelo Azure Firewall do hub.</text>
</svg>
