<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562" role="img" aria-label="Quatro agentes conectados a uma unica Managed Identity central">
  <rect width="1000" height="562" fill="#FFFFFF"/>
  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#10233F">Identidade compartilhada entre agentes</text>
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4A5568">Uma unica Managed Identity no centro concentra a permissao de todos</text>
  <g stroke="#A9C5F2" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round">
    <line x1="210" y1="205" x2="500" y2="310"/>
    <line x1="790" y1="205" x2="500" y2="310"/>
    <line x1="210" y1="455" x2="500" y2="310"/>
    <line x1="790" y1="455" x2="500" y2="310"/>
  </g>
