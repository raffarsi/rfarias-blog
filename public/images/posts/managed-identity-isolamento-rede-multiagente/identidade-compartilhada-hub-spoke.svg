  <text x="500" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1 Managed</text>
  <text x="500" y="354" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Identity</text>
  <text x="60" y="535" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#4A5568">A permissao vira a uniao do que todos precisam, e o log registra a identidade, nao o agente.</text>
</svg>
