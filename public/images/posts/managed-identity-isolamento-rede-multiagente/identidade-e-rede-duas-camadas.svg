<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562" role="img" aria-label="Duas camadas empilhadas: identidade acima, rede abaixo">
  <rect width="1000" height="562" fill="#FFFFFF"/>
  <text x="60" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#10233F">Identidade e rede respondem perguntas diferentes</text>
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4A5568">Uma camada nao substitui a outra</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="145" width="880" height="150" rx="10" fill="#1A56DB"/>
    <g transform="translate(96,195) scale(1.9)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
    </g>
    <text x="175" y="188" font-size="13" font-weight="700" letter-spacing="1.8" fill="#DBE7FB">CAMADA 1</text>
    <text x="175" y="222" font-size="21" font-weight="700" fill="#FFFFFF">Identidade  responde QUEM</text>
    <text x="175" y="254" font-size="16" fill="#FFFFFF">Managed Identity dedicada por agente e RBAC no menor escopo.</text>
    <text x="175" y="278" font-size="16" fill="#FFFFFF">Limita o que cada agente pode tocar.</text>
    <rect x="130" y="325" width="810" height="150" rx="10" fill="#DBE7FB" stroke="#A9C5F2" stroke-width="2"/>
    <g transform="translate(166,377) scale(1.9)" fill="none" stroke="#1A56DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
    <text x="245" y="368" font-size="13" font-weight="700" letter-spacing="1.8" fill="#2A5CAE">CAMADA 2</text>
    <text x="245" y="402" font-size="21" font-weight="700" fill="#10233F">Rede  responde DE ONDE</text>
    <text x="245" y="434" font-size="16" fill="#10233F">Private Endpoint, DNS privado e NSG.</text>
    <text x="245" y="458" font-size="16" fill="#10233F">Limita de quais caminhos o recurso aceita conversa.</text>
  </g>
  <text x="60" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#4A5568">Identidade sozinha nao cobre credencial usada de fora. Rede sozinha nao cobre permissao ampla.</text>
</svg>
