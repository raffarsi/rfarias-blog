backend:
  name: github
  repo: raffarsi/rfarias-blog
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "posts-tech"
    label: "Posts — Tecnologia"
    folder: "src/pages/posts"
    create: true
    slug: "{{slug}}"
    filter:
      field: tag
      value: tech
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "../../layouts/PostLayout.astro" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoria", name: "category", widget: "select", options: ["Azure", "Cloud", "IA", "DevOps", "Arquitetura"] }
      - { label: "Tag", name: "tag", widget: "hidden", default: "tech" }
      - { label: "Data", name: "date", widget: "string" }
      - { label: "Tempo de leitura", name: "readTime", widget: "string", default: "8 min" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: "posts-carreira"
    label: "Posts — Carreira"
    folder: "src/pages/posts"
    create: true
    slug: "{{slug}}"
    filter:
      field: tag
      value: carreira
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "../../layouts/PostLayout.astro" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoria", name: "category", widget: "hidden", default: "Carreira" }
      - { label: "Tag", name: "tag", widget: "hidden", default: "carreira" }
      - { label: "Data", name: "date", widget: "string" }
      - { label: "Tempo de leitura", name: "readTime", widget: "string", default: "5 min" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
